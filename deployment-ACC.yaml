  DATABASE_PORT: "3306"
  BACKEND_SNAPSHOT_VERSION: "${BACKEND_SNAPSHOT_VERSION}"
  BACKEND_VERSION: "${BACKEND_VERSION}"
  JWT_SECRET: DJFDG#!N4EW87R9(FHFD^F32
  ENCRYPTION_KEY: b6424bcf211217cc99e17c27f1d36dafbe6ab3db75c65b3a10c3ab8162d1e2cd
  ALLOWED_ORIGIN: "https://management-acc.bitsenbytes.net"
---

#Mysql

---
apiVersion: v1
kind: Secret
metadata:
  name: bitsenbytes-mysql-secret
  namespace: bitsenbytes-management-platform
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "fdD6@Ba_6*B.Fa"
  MYSQL_DATABASE: "managementDB"
  MYSQL_USER: "bitsenbytes"
  MYSQL_PASSWORD: "fdD6@Ba_6*B.Fa"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitsenbytes-mysql-pvc
  namespace: bitsenbytes-management-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitsenbytes-mysql
  namespace: bitsenbytes-management-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bitsenbytes-mysql
  template:
    metadata:
      labels:
        app: bitsenbytes-mysql
    spec:
      containers:
        - name: bitsenbytes-mysql
          image: mysql:8.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-mysql-secret
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-mysql-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-mysql-secret
                  key: MYSQL_PASSWORD

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: bitsenbytes-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: bitsenbytes-mysql
  namespace: bitsenbytes-management-platform
spec:
  type: ClusterIP
  selector:
    app: bitsenbytes-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: bitsenbytes-mysql-nodeport
  namespace: bitsenbytes-management-platform
spec:
  type: NodePort
  selector:
    app: bitsenbytes-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: 30307