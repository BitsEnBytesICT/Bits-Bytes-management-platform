#frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitsenbytes-frontend-prod
  namespace: bitsenbytes-management-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bitsenbytes-frontend-prod
  template:
    metadata:
      labels:
        app: bitsenbytes-frontend-prod
    spec:
      containers:
        - name: bitsenbytes-frontend-prod
          image: docker-registry.bitsenbytes.net/managementplatform:bitsenbytesfrontendPROD_0.0.4
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: bitsenbytes-frontend-prod
  namespace: bitsenbytes-management-platform
spec:
  selector:
    app: bitsenbytes-frontend-prod
  ports:
    - port: 8080
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitsenbytes-prod
  namespace: bitsenbytes-management-platform
spec:
  rules:
    - host: management.bitsenbytes.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bitsenbytes-backend-prod
                port:
                  number: 3000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: bitsenbytes-frontend-prod
                port:
                  number: 8080
---
#backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitsenbytes-backend-prod
  namespace: bitsenbytes-management-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitsenbytes-backend-prod
  template:
    metadata:
      labels:
        app: bitsenbytes-backend-prod
    spec:
      containers:
        - name: bitsenbytes-backend-prod
          image: docker-registry.bitsenbytes.net/managementplatform:bitsenbytesbackendPROD_0.0.2_test_deployment_3
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: NODE_ENV
            - name: DATABASE_TYPE
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_TYPE
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_NAME
            - name: INVENTORYDB_NAME
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: INVENTORYDB_NAME
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: bitsenbytes-backend-prod
  namespace: bitsenbytes-management-platform
spec:
  selector:
    app: bitsenbytes-backend-prod
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: bitsenbytes-backend-secret
  namespace: bitsenbytes-management-platform
type: Opaque
stringData:
  NODE_ENV: "production"
  DATABASE_TYPE: "mysql"
  DATABASE_URL: "bitsenbytes-mysql"
  DATABASE_USERNAME: "bitsenbytes"
  DATABASE_PASSWORD: "password"
  DATABASE_NAME: "managementDB"
  INVENTORYDB_NAME: "managementDB"
  DATABASE_PORT: "3306"
---

#Mysql

---
apiVersion: v1
kind: Secret
metadata:
  name: bitsenbytes-mysql-secret
  namespace: bitsenbytes-management-platform
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "password"
  MYSQL_DATABASE: "managementDB"
  MYSQL_USER: "bitsenbytes"
  MYSQL_PASSWORD: "password"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitsenbytes-mysql-pvc
  namespace: bitsenbytes-management-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitsenbytes-mysql
  namespace: bitsenbytes-management-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bitsenbytes-mysql
  template:
    metadata:
      labels:
        app: bitsenbytes-mysql
    spec:
      containers:
        - name: bitsenbytes-mysql
          image: mysql:8.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-mysql-secret
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-mysql-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-mysql-secret
                  key: MYSQL_PASSWORD

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: bitsenbytes-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: bitsenbytes-mysql
  namespace: bitsenbytes-management-platform
spec:
  type: ClusterIP
  selector:
    app: bitsenbytes-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: bitsenbytes-mysql-nodeport
  namespace: bitsenbytes-management-platform
spec:
  type: NodePort
  selector:
    app: bitsenbytes-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: 30306