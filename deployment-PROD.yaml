#frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitsenbytes-frontend-prod
  namespace: bitsenbytes-management-platform
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: bitsenbytes-frontend-prod
  template:
    metadata:
      labels:
        app: bitsenbytes-frontend-prod
    spec:
      containers:
        - name: bitsenbytes-frontend-prod
          image: docker-registry.bitsenbytes.net/managementplatform:bitsenbytesfrontendPROD_0.0.4
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: bitsenbytes-frontend-prod
  namespace: bitsenbytes-management-platform
spec:
  selector:
    app: bitsenbytes-frontend-prod
  ports:
    - port: 8080
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitsenbytes-prod
  namespace: bitsenbytes-management-platform
spec:
  rules:
    - host: management.bitsenbytes.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bitsenbytes-backend-prod
                port:
                  number: 3000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: bitsenbytes-frontend-prod
                port:
                  number: 8080
---
#backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitsenbytes-backend-prod
  namespace: bitsenbytes-management-platform
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: bitsenbytes-backend-prod
  template:
    metadata:
      labels:
        app: bitsenbytes-backend-prod
    spec:
      containers:
        - name: bitsenbytes-backend-prod
          image: docker-registry.bitsenbytes.net/managementplatform:bitsenbytesbackendPROD_0.0.2_test_deployment_3
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: NODE_ENV
            - name: DATABASE_TYPE
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_TYPE
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_NAME
            - name: INVENTORYDB_NAME
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: INVENTORYDB_NAME
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: DATABASE_URL
            - name: BACKEND_VERSION
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: BACKEND_VERSION
            - name: BACKEND_SNAPSHOT_VERSION
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: BACKEND_SNAPSHOT_VERSION
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: ENCRYPTION_KEY
            - name: ALLOWED_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: bitsenbytes-backend-secret
                  key: ALLOWED_ORIGIN
---
apiVersion: v1
kind: Service
metadata:
  name: bitsenbytes-backend-prod
  namespace: bitsenbytes-management-platform
spec:
  selector:
    app: bitsenbytes-backend-prod
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: bitsenbytes-backend-secret
  namespace: bitsenbytes-management-platform
type: Opaque
stringData:
  NODE_ENV: "${NODE_ENV}"
  DATABASE_TYPE: "${DATABASE_TYPE}"
  DATABASE_URL: "${DATABASE_URL}"
  DATABASE_USERNAME: "${DATABASE_USERNAME}"
  DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
  DATABASE_NAME: "${DATABASE_NAME}"
  INVENTORYDB_NAME: "${INVENTORYDB_NAME}"
  DATABASE_PORT: "${DATABASE_PORT}"
  BACKEND_SNAPSHOT_VERSION: "0"
  BACKEND_VERSION: "0.0.6"
  JWT_SECRET: "${JWT_SECRET}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
  ALLOWED_ORIGIN: "${ALLOWED_ORIGIN}"

# MySQL wordt gedeeld met ACC en beheerd in deployment-ACC.yaml.
# De operator maakt de interne Service bitsenbytes-mysql aan.